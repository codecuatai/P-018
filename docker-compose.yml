services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      CORE_DB_NAME: ${CORE_DB_NAME:?CORE_DB_NAME is required}
      CORE_DB_USER: ${CORE_DB_USER:?CORE_DB_USER is required}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?CORE_DB_PASSWORD is required}
      AGENT_DB_NAME: ${AGENT_DB_NAME:?AGENT_DB_NAME is required}
      AGENT_DB_USER: ${AGENT_DB_USER:?AGENT_DB_USER is required}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}
      RIDE_DB_NAME: ${RIDE_DB_NAME:?RIDE_DB_NAME is required}
      RIDE_DB_USER: ${RIDE_DB_USER:?RIDE_DB_USER is required}
      RIDE_DB_PASSWORD: ${RIDE_DB_PASSWORD:?RIDE_DB_PASSWORD is required}
      RESTAURANT_DB_NAME: ${RESTAURANT_DB_NAME:?RESTAURANT_DB_NAME is required}
      RESTAURANT_DB_USER: ${RESTAURANT_DB_USER:?RESTAURANT_DB_USER is required}
      RESTAURANT_DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:?RESTAURANT_DB_PASSWORD is required}
      HEALTHCARE_DB_NAME: ${HEALTHCARE_DB_NAME:?HEALTHCARE_DB_NAME is required}
      HEALTHCARE_DB_USER: ${HEALTHCARE_DB_USER:?HEALTHCARE_DB_USER is required}
      HEALTHCARE_DB_PASSWORD: ${HEALTHCARE_DB_PASSWORD:?HEALTHCARE_DB_PASSWORD is required}
      FOOD_DB_NAME: ${FOOD_DB_NAME:?FOOD_DB_NAME is required}
      FOOD_DB_USER: ${FOOD_DB_USER:?FOOD_DB_USER is required}
      FOOD_DB_PASSWORD: ${FOOD_DB_PASSWORD:?FOOD_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [xone_internal]

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      NODE_ENV: ${APP_ENV:?APP_ENV is required}
      PORT: ${API_GATEWAY_PORT:?API_GATEWAY_PORT is required}
      DATABASE_URL: ${CORE_DATABASE_URL:?CORE_DATABASE_URL is required}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:?AGENT_SERVICE_URL is required}
      RIDE_SERVICE_URL: ${RIDE_SERVICE_URL:?RIDE_SERVICE_URL is required}
      RESTAURANT_SERVICE_URL: ${RESTAURANT_SERVICE_URL:?RESTAURANT_SERVICE_URL is required}
      HEALTHCARE_SERVICE_URL: ${HEALTHCARE_SERVICE_URL:?HEALTHCARE_SERVICE_URL is required}
      FOOD_SERVICE_URL: ${FOOD_SERVICE_URL:?FOOD_SERVICE_URL is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:?DEMO_AUTH_ENABLED is required}
      DEMO_AUTH_EMAIL: ${DEMO_AUTH_EMAIL:?DEMO_AUTH_EMAIL is required}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD:?DEMO_AUTH_PASSWORD is required}
      DEMO_AUTH_USER_ID: ${DEMO_AUTH_USER_ID:?DEMO_AUTH_USER_ID is required}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:?UPSTREAM_TIMEOUT_MS is required}
      CONFIRMATION_TTL_SECONDS: ${CONFIRMATION_TTL_SECONDS:?CONFIRMATION_TTL_SECONDS is required}
      CONFIRMATION_PROCESSING_TIMEOUT_SECONDS: ${CONFIRMATION_PROCESSING_TIMEOUT_SECONDS:?CONFIRMATION_PROCESSING_TIMEOUT_SECONDS is required}
      CONFIRMATION_RECOVERY_POLL_INTERVAL_MS: ${CONFIRMATION_RECOVERY_POLL_INTERVAL_MS:?CONFIRMATION_RECOVERY_POLL_INTERVAL_MS is required}
      GATEWAY_WORKFLOW_WORKER_ENABLED: ${GATEWAY_WORKFLOW_WORKER_ENABLED:?GATEWAY_WORKFLOW_WORKER_ENABLED is required}
      GATEWAY_WORKFLOW_POLL_INTERVAL_MS: ${GATEWAY_WORKFLOW_POLL_INTERVAL_MS:?GATEWAY_WORKFLOW_POLL_INTERVAL_MS is required}
      RESTAURANT_REJECTION_RATE: ${RESTAURANT_REJECTION_RATE:?RESTAURANT_REJECTION_RATE is required}
      RESTAURANT_FORCE_RESULT: ${RESTAURANT_FORCE_RESULT:-}
    ports: ["${API_GATEWAY_PORT}:3000"]
    restart: unless-stopped
    networks: [xone_internal]

  agent-service:
    build: ./apps/agent-service
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_PORT: ${AGENT_SERVICE_PORT:?AGENT_SERVICE_PORT is required}
      DATABASE_URL: ${AGENT_DATABASE_URL:?AGENT_DATABASE_URL is required}
      CORS_ORIGINS: ${AGENT_CORS_ORIGINS:?AGENT_CORS_ORIGINS is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:?GEMINI_MODEL is required}
      API_GATEWAY_INTERNAL_URL: ${API_GATEWAY_INTERNAL_URL:?API_GATEWAY_INTERNAL_URL is required}
      AGENT_MODEL_MODE: ${AGENT_MODEL_MODE:-deterministic}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    expose: ["8001"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [xone_internal]

  ride-service:
    build: ./services/ride-service
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_PORT: ${RIDE_SERVICE_PORT:?RIDE_SERVICE_PORT is required}
      DATABASE_URL: ${RIDE_DATABASE_URL:?RIDE_DATABASE_URL is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [xone_internal]

  restaurant-service:
    build: ./services/restaurant-service
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_PORT: ${RESTAURANT_SERVICE_PORT:?RESTAURANT_SERVICE_PORT is required}
      DATABASE_URL: ${RESTAURANT_DATABASE_URL:?RESTAURANT_DATABASE_URL is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [xone_internal]

  healthcare-service:
    build: ./services/healthcare-service
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_PORT: ${HEALTHCARE_SERVICE_PORT:?HEALTHCARE_SERVICE_PORT is required}
      DATABASE_URL: ${HEALTHCARE_DATABASE_URL:?HEALTHCARE_DATABASE_URL is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [xone_internal]

  food-service:
    build: ./services/food-service
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_PORT: ${FOOD_SERVICE_PORT:?FOOD_SERVICE_PORT is required}
      DATABASE_URL: ${FOOD_DATABASE_URL:?FOOD_DATABASE_URL is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      PERSISTENCE: ${FOOD_PERSISTENCE:?FOOD_PERSISTENCE is required}
      RESTAURANT_REJECTION_RATE: ${RESTAURANT_REJECTION_RATE:?RESTAURANT_REJECTION_RATE is required}
      DELIVERY_BASE_FEE: ${DELIVERY_BASE_FEE:?DELIVERY_BASE_FEE is required}
      DELIVERY_PER_KM_FEE: ${DELIVERY_PER_KM_FEE:?DELIVERY_PER_KM_FEE is required}
      DELIVERY_MINIMUM_FEE: ${DELIVERY_MINIMUM_FEE:?DELIVERY_MINIMUM_FEE is required}
      DELIVERY_MAX_DISTANCE_KM: ${DELIVERY_MAX_DISTANCE_KM:?DELIVERY_MAX_DISTANCE_KM is required}
      DELIVERY_LONG_DISTANCE_THRESHOLD_KM: ${DELIVERY_LONG_DISTANCE_THRESHOLD_KM:?DELIVERY_LONG_DISTANCE_THRESHOLD_KM is required}
      DELIVERY_LONG_DISTANCE_SURCHARGE: ${DELIVERY_LONG_DISTANCE_SURCHARGE:?DELIVERY_LONG_DISTANCE_SURCHARGE is required}
      DELIVERY_ETA_MINUTES: ${DELIVERY_ETA_MINUTES:?DELIVERY_ETA_MINUTES is required}
      FOOD_RESTAURANT_CONFIRM_DELAY_MS: ${FOOD_RESTAURANT_CONFIRM_DELAY_MS:?FOOD_RESTAURANT_CONFIRM_DELAY_MS is required}
      FOOD_PREPARING_DELAY_MS: ${FOOD_PREPARING_DELAY_MS:?FOOD_PREPARING_DELAY_MS is required}
      FOOD_READY_FOR_PICKUP_DELAY_MS: ${FOOD_READY_FOR_PICKUP_DELAY_MS:?FOOD_READY_FOR_PICKUP_DELAY_MS is required}
      FOOD_DRIVER_ASSIGN_DELAY_MS: ${FOOD_DRIVER_ASSIGN_DELAY_MS:?FOOD_DRIVER_ASSIGN_DELAY_MS is required}
      FOOD_PICKUP_DELAY_MS: ${FOOD_PICKUP_DELAY_MS:?FOOD_PICKUP_DELAY_MS is required}
      FOOD_DELIVERY_DELAY_MS: ${FOOD_DELIVERY_DELAY_MS:?FOOD_DELIVERY_DELAY_MS is required}
      FOOD_WORKFLOW_POLL_INTERVAL_MS: ${FOOD_WORKFLOW_POLL_INTERVAL_MS:?FOOD_WORKFLOW_POLL_INTERVAL_MS is required}
      FOOD_WORKFLOW_WORKER_ENABLED: ${FOOD_WORKFLOW_WORKER_ENABLED:?FOOD_WORKFLOW_WORKER_ENABLED is required}
    expose: ["8104"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    networks: [xone_internal]

volumes:
  postgres_data:

networks:
  xone_internal:
    driver: bridge
