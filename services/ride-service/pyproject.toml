[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xone-ride-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "pydantic-settings>=2.7.0", "sqlalchemy>=2.0.0", "alembic>=1.14.0", "psycopg[binary]>=3.2.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.0.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
