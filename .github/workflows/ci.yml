name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  python-services:
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        service: [apps/agent-service, services/ride-service, services/restaurant-service, services/healthcare-service, services/food-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install service with test dependencies
        run: pip install "${{ matrix.service }}[dev]"
      - name: Lint service
        run: ruff check "${{ matrix.service }}/src" "${{ matrix.service }}/tests"
      - name: Test service
        run: |
          if [ "${{ matrix.service }}" = "services/food-service" ]; then
            cd "${{ matrix.service }}" && pytest tests -q --ignore=tests/test_postgres_integration.py
          else
            cd "${{ matrix.service }}" && pytest tests -q
          fi

  gateway:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && pnpm --dir apps/api-gateway install --frozen-lockfile
      - run: corepack enable && pnpm --dir apps/api-gateway run lint && pnpm --dir apps/api-gateway test -- --runInBand --testPathIgnorePatterns=core.postgres.integration.spec.ts && pnpm --dir apps/api-gateway build

  postgres-integration:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xone_core
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Food database
        env: { PGPASSWORD: postgres }
        run: psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE xone_food"
      - name: Run Food PostgreSQL integration
        run: |
          pip install "services/food-service[dev]"
          cd services/food-service
          FOOD_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/xone_food pytest tests/test_postgres_integration.py -q
      - name: Run Gateway PostgreSQL integration
        run: |
          corepack enable
          pnpm --dir apps/api-gateway install --frozen-lockfile
          CORE_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/xone_core pnpm --dir apps/api-gateway test -- --runInBand test/core.postgres.integration.spec.ts

  web:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/web && npm ci && npm run build

  compose:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate-env-config.py
      - run: python scripts/check-migration-parity.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build api-gateway food-service agent-service
