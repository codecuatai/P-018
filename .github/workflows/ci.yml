name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  schedule:
    # 01:00 Asia/Bangkok. Scheduled workflows use UTC.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  detect-changes:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      agent: ${{ steps.filter.outputs.agent }}
      ride: ${{ steps.filter.outputs.ride }}
      restaurant: ${{ steps.filter.outputs.restaurant }}
      healthcare: ${{ steps.filter.outputs.healthcare }}
      food: ${{ steps.filter.outputs.food }}
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Select CI scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          full=false
          if [[ "$EVENT_NAME" == "schedule" || \
                "$EVENT_NAME" == "workflow_dispatch" || \
                "$REF_NAME" == "main" ]]; then
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # For pushes to a long-lived branch, compare with that branch's
          # previous commit instead of comparing staging/develop with main.
          base: ${{ github.ref }}
          filters: |
            agent:
              - '.github/workflows/ci.yml'
              - 'ruff.toml'
              - 'packages/**'
              - 'apps/agent-service/**'
            ride:
              - '.github/workflows/ci.yml'
              - 'ruff.toml'
              - 'packages/**'
              - 'services/ride-service/**'
            restaurant:
              - '.github/workflows/ci.yml'
              - 'ruff.toml'
              - 'packages/**'
              - 'services/restaurant-service/**'
            healthcare:
              - '.github/workflows/ci.yml'
              - 'ruff.toml'
              - 'packages/**'
              - 'services/healthcare-service/**'
            food:
              - '.github/workflows/ci.yml'
              - 'ruff.toml'
              - 'packages/**'
              - 'services/food-service/**'
            gateway:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/**'
              - 'apps/api-gateway/**'
            web:
              - '.github/workflows/ci.yml'
              - 'packages/**'
              - 'apps/web/**'
            compose:
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
              - '.env.example'
              - 'docker-compose.yml'
              - 'infra/**'
              - 'scripts/validate-env-config.py'
              - 'scripts/check-migration-parity.py'
              - 'scripts/migrate.sh'
              - 'scripts/migrate.ps1'
              - 'apps/api-gateway/migrations/**'
              - 'services/**/migrations/**'

  agent-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.agent == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "apps/agent-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "apps/agent-service/src" "apps/agent-service/tests"
      - name: Test service
        working-directory: apps/agent-service
        run: ../../.ci-venv/bin/python -m pytest tests -q

  ride-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ride == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/ride-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/ride-service/src" "services/ride-service/tests"
      - name: Test service
        working-directory: services/ride-service
        run: ../../.ci-venv/bin/python -m pytest tests -q

  restaurant-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.restaurant == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/restaurant-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/restaurant-service/src" "services/restaurant-service/tests"
      - name: Test service
        working-directory: services/restaurant-service
        run: ../../.ci-venv/bin/python -m pytest tests -q

  healthcare-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.healthcare == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/healthcare-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/healthcare-service/src" "services/healthcare-service/tests"
      - name: Test service
        working-directory: services/healthcare-service
        run: ../../.ci-venv/bin/python -m pytest tests -q

  food-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.food == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/food-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/food-service/src" "services/food-service/tests"
      - name: Test service
        working-directory: services/food-service
        run: ../../.ci-venv/bin/python -m pytest tests -q --ignore=tests/test_postgres_integration.py

  gateway:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install gateway dependencies
        run: pnpm install --filter @x-one/api-gateway... --frozen-lockfile
      - name: Lint, test, and build gateway
        run: pnpm --dir apps/api-gateway run lint && pnpm --dir apps/api-gateway test -- --runInBand --testPathIgnorePatterns=core.postgres.integration.spec.ts && pnpm --dir apps/api-gateway build

  food-postgres-integration:
    needs: detect-changes
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      (needs.detect-changes.outputs.food == 'true' ||
       needs.detect-changes.outputs.full == 'true')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xone_food
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d xone_food"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install Food service dependencies
        run: .ci-venv/bin/python -m pip install -e "services/food-service[dev]"
      - name: Run Food PostgreSQL integration
        working-directory: services/food-service
        env:
          FOOD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:55432/xone_food
        run: ../../.ci-venv/bin/python -m pytest tests/test_postgres_integration.py -q

  gateway-postgres-integration:
    needs: detect-changes
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      (needs.detect-changes.outputs.gateway == 'true' ||
       needs.detect-changes.outputs.full == 'true')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xone_core
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d xone_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install gateway dependencies
        run: pnpm install --filter @x-one/api-gateway... --frozen-lockfile
      - name: Run Gateway PostgreSQL integration
        env:
          CORE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:55433/xone_core
        run: pnpm --dir apps/api-gateway test -- --runInBand test/core.postgres.integration.spec.ts

  web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install web dependencies
        run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Build web
        working-directory: apps/web
        run: npm run build

  compose:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.compose == 'true' || needs.detect-changes.outputs.full == 'true' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate environment configuration
        run: python scripts/validate-env-config.py
      - name: Validate migration parity
        run: python scripts/check-migration-parity.py
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
