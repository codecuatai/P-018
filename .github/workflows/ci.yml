name: CI

on:
  push:
    branches: [main, develop, staging, 'feature/**']
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # Job Detect: Quét Git Diff để phát hiện thư mục thay đổi
  # ----------------------------------------------------
  detect-changes:
    runs-on: [self-hosted, linux, x64]
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      ride: ${{ steps.filter.outputs.ride }}
      restaurant: ${{ steps.filter.outputs.restaurant }}
      healthcare: ${{ steps.filter.outputs.healthcare }}
      food: ${{ steps.filter.outputs.food }}
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Nếu thay đổi các file cấu hình toàn cục, ta bắt buộc chạy toàn bộ tests
          filters: |
            global: &global
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/**'
              - 'infra/**'
              - 'scripts/**'
            agent:
              - *global
              - 'apps/agent-service/**'
            ride:
              - *global
              - 'services/ride-service/**'
            restaurant:
              - *global
              - 'services/restaurant-service/**'
            healthcare:
              - *global
              - 'services/healthcare-service/**'
            food:
              - *global
              - 'services/food-service/**'
            gateway:
              - *global
              - 'apps/api-gateway/**'
            web:
              - *global
              - 'apps/web/**'
            compose:
              - *global
              - 'docker-compose.yml'
              - 'apps/api-gateway/**'
              - 'apps/agent-service/**'
              - 'services/**'

  # ----------------------------------------------------
  # Các Job kiểm thử riêng biệt cho từng Python Service
  # ----------------------------------------------------
  agent-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.agent == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/agent-service/pyproject.toml
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "apps/agent-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "apps/agent-service/src" "apps/agent-service/tests"
      - name: Test service
        run: |
          cd apps/agent-service && ../../.ci-venv/bin/python -m pytest tests -q

  ride-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ride == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ride-service/pyproject.toml
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/ride-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/ride-service/src" "services/ride-service/tests"
      - name: Test service
        run: |
          cd services/ride-service && ../../.ci-venv/bin/python -m pytest tests -q

  restaurant-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.restaurant == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/restaurant-service/pyproject.toml
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/restaurant-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/restaurant-service/src" "services/restaurant-service/tests"
      - name: Test service
        run: |
          cd services/restaurant-service && ../../.ci-venv/bin/python -m pytest tests -q

  healthcare-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.healthcare == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/healthcare-service/pyproject.toml
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/healthcare-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/healthcare-service/src" "services/healthcare-service/tests"
      - name: Test service
        run: |
          cd services/healthcare-service && ../../.ci-venv/bin/python -m pytest tests -q

  food-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.food == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/food-service/pyproject.toml
      - name: Create Python environment
        run: python -m venv .ci-venv
      - name: Install dependencies
        run: .ci-venv/bin/python -m pip install -e "services/food-service[dev]"
      - name: Lint service
        run: .ci-venv/bin/python -m ruff check "services/food-service/src" "services/food-service/tests"
      - name: Test service
        run: |
          cd services/food-service && ../../.ci-venv/bin/python -m pytest tests -q --ignore=tests/test_postgres_integration.py

  # ----------------------------------------------------
  # Job Gateway NestJS
  # ----------------------------------------------------
  gateway:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install gateway dependencies
        run: pnpm install --filter @x-one/api-gateway... --frozen-lockfile
      - run: pnpm --dir apps/api-gateway run lint && pnpm --dir apps/api-gateway test -- --runInBand --testPathIgnorePatterns=core.postgres.integration.spec.ts && pnpm --dir apps/api-gateway build

  # ----------------------------------------------------
  # Job Test tích hợp PostgreSQL
  # ----------------------------------------------------
  postgres-integration:
    if: github.event_name == 'push' && (needs.detect-changes.outputs.food == 'true' || needs.detect-changes.outputs.gateway == 'true')
    needs: detect-changes
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xone_core
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/food-service/pyproject.toml
      - name: Install Food service dependencies
        run: |
          python -m venv services/food-service/.ci-venv
          services/food-service/.ci-venv/bin/python -m pip install -e "services/food-service[dev]"
      - name: Install PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create Food database
        env: { PGPASSWORD: postgres }
        run: psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE xone_food"
      - name: Run Food PostgreSQL integration
        run: |
          cd services/food-service
          FOOD_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/xone_food .ci-venv/bin/python -m pytest tests/test_postgres_integration.py -q
      - name: Run Gateway PostgreSQL integration
        shell: bash
        run: |
          pnpm install --filter @x-one/api-gateway... --frozen-lockfile
          CORE_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/xone_core pnpm --dir apps/api-gateway test -- --runInBand test/core.postgres.integration.spec.ts

  # ----------------------------------------------------
  # Job Frontend Web
  # ----------------------------------------------------
  web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Cache web node_modules
        id: web-modules-cache
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-node20-${{ hashFiles('apps/web/package-lock.json', 'apps/web/package.json') }}
      - name: Ensure web dependencies
        shell: bash
        run: |
          if [ ! -x apps/web/node_modules/.bin/vite ] || \
             [ ! -x apps/web/node_modules/.bin/tsc ]; then
            npm --prefix apps/web ci --prefer-offline --no-audit --no-fund
          fi
      - run: cd apps/web && npm run build

  # ----------------------------------------------------
  # Job Validate Docker Compose
  # ----------------------------------------------------
  compose:
    if: github.event_name == 'push' && needs.detect-changes.outputs.compose == 'true'
    needs: detect-changes
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/validate-env-config.py
      - run: python scripts/check-migration-parity.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build --parallel api-gateway food-service agent-service
