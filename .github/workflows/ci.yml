name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/agent-service/pyproject.toml
            services/ride-service/pyproject.toml
            services/restaurant-service/pyproject.toml
            services/healthcare-service/pyproject.toml
            services/food-service/pyproject.toml
      - name: Create shared Python CI environment
        run: python -m venv .ci-venv
      - name: Install all Python service dependencies
        shell: bash
        run: |
          .ci-venv/bin/python -m pip install \
            -e "apps/agent-service[dev]" \
            -e "services/ride-service[dev]" \
            -e "services/restaurant-service[dev]" \
            -e "services/healthcare-service[dev]" \
            -e "services/food-service[dev]"
      - name: Lint and test all Python services
        shell: bash
        run: |
          set +e
          failed=0
          python_bin="$PWD/.ci-venv/bin/python"
          services=(
            "apps/agent-service"
            "services/ride-service"
            "services/restaurant-service"
            "services/healthcare-service"
            "services/food-service"
          )

          for service in "${services[@]}"; do
            echo "::group::Lint $service"
            "$python_bin" -m ruff check "$service/src" "$service/tests"
            if [ $? -ne 0 ]; then
              failed=1
            fi
            echo "::endgroup::"

            echo "::group::Test $service"
            if [ "$service" = "services/food-service" ]; then
              (cd "$service" && \
                "$python_bin" -m pytest tests -q --ignore=tests/test_postgres_integration.py)
            else
              (cd "$service" && "$python_bin" -m pytest tests -q)
            fi
            if [ $? -ne 0 ]; then
              failed=1
            fi
            echo "::endgroup::"
          done

          exit "$failed"

  gateway:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache gateway node_modules
        id: gateway-modules-cache
        uses: actions/cache@v4
        with:
          path: apps/api-gateway/node_modules
          key: gateway-node-modules-${{ runner.os }}-node22-pnpm9.15.0-${{ hashFiles('pnpm-lock.yaml', 'apps/api-gateway/package.json') }}
      - name: Ensure gateway dependencies
        shell: bash
        run: |
          if [ ! -x apps/api-gateway/node_modules/.bin/jest ] || \
             [ ! -x apps/api-gateway/node_modules/.bin/tsc ]; then
            pnpm --dir apps/api-gateway install --frozen-lockfile --prefer-offline
          fi
      - run: pnpm --dir apps/api-gateway run lint && pnpm --dir apps/api-gateway test -- --runInBand --testPathIgnorePatterns=core.postgres.integration.spec.ts && pnpm --dir apps/api-gateway build

  postgres-integration:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xone_core
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/food-service/pyproject.toml
      - name: Cache Food service virtualenv
        id: food-venv-cache
        uses: actions/cache@v4
        with:
          path: services/food-service/.ci-venv
          key: python-venv-${{ runner.os }}-${{ runner.arch }}-3.11-services/food-service-${{ hashFiles('services/food-service/pyproject.toml') }}
      - name: Cache gateway node_modules
        id: integration-gateway-modules-cache
        uses: actions/cache@v4
        with:
          path: apps/api-gateway/node_modules
          key: gateway-node-modules-${{ runner.os }}-node22-pnpm9.15.0-${{ hashFiles('pnpm-lock.yaml', 'apps/api-gateway/package.json') }}
      - name: Ensure Food service dependencies
        shell: bash
        run: |
          venv=services/food-service/.ci-venv
          if [ ! -x "$venv/bin/python" ]; then
            python -m venv "$venv"
          fi
          if ! "$venv/bin/python" -c "import pytest, asyncpg" >/dev/null 2>&1 || \
             ! "$venv/bin/python" -m ruff --version >/dev/null 2>&1; then
            "$venv/bin/python" -m pip install -e "services/food-service[dev]"
          fi
      - name: Install PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create Food database
        env: { PGPASSWORD: postgres }
        run: psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE xone_food"
      - name: Run Food PostgreSQL integration
        run: |
          cd services/food-service
          FOOD_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/xone_food .ci-venv/bin/python -m pytest tests/test_postgres_integration.py -q
      - name: Run Gateway PostgreSQL integration
        shell: bash
        run: |
          if [ ! -x apps/api-gateway/node_modules/.bin/jest ]; then
            pnpm --dir apps/api-gateway install --frozen-lockfile --prefer-offline
          fi
          CORE_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/xone_core pnpm --dir apps/api-gateway test -- --runInBand test/core.postgres.integration.spec.ts

  web:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Cache web node_modules
        id: web-modules-cache
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: web-node-modules-${{ runner.os }}-node20-${{ hashFiles('apps/web/package-lock.json', 'apps/web/package.json') }}
      - name: Ensure web dependencies
        shell: bash
        run: |
          if [ ! -x apps/web/node_modules/.bin/vite ] || \
             [ ! -x apps/web/node_modules/.bin/tsc ]; then
            npm --prefix apps/web ci --prefer-offline --no-audit --no-fund
          fi
      - run: cd apps/web && npm run build

  compose:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/validate-env-config.py
      - run: python scripts/check-migration-parity.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build --parallel api-gateway food-service agent-service
