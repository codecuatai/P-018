name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [apps/agent-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install service with test dependencies
        run: pip install -e "./${{ matrix.service }}[dev]"
      - name: Lint service
        run: ruff check "${{ matrix.service }}/src" "${{ matrix.service }}/tests"
      - name: Test service
        run: cd "${{ matrix.service }}" && pytest tests -q

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pnpm install --filter @x-one/api-gateway... --frozen-lockfile
      - run: pnpm --dir apps/api-gateway run lint && pnpm --dir apps/api-gateway run test --runInBand --testPathIgnorePatterns=core.postgres.integration.spec.ts && pnpm --dir apps/api-gateway run build

  anti-overfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Agent test dependencies
        run: pip install -e "./apps/agent-service[dev]"
      - name: Run opaque-ID and runtime literal regression tests
        run: cd apps/agent-service && pytest tests/test_agents/test_hardening.py -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xone_core
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run Gateway PostgreSQL integration
        run: |
          corepack enable
          pnpm install --filter @x-one/api-gateway... --frozen-lockfile
          CORE_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/xone_core AUTH_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/xone_core pnpm --dir apps/api-gateway run test --runInBand test/core.postgres.integration.spec.ts test/auth.postgres.integration.spec.ts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --filter p018-frontend-web... --frozen-lockfile
      - run: pnpm --dir apps/web run lint && pnpm --dir apps/web run typecheck && pnpm --dir apps/web run test --runInBand --silent && pnpm --dir apps/web run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/quality/validate-env-config.py
      - run: python scripts/database/check-migration-parity.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build api-gateway web agent-service
