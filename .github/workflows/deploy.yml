name: VPS Staging CI/CD (SSH Deploy)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Thực thi lệnh trên VPS qua SSH để tự động kéo code và build
      - name: SSH and Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # 1. Di chuyển vào thư mục dự án trên VPS
            cd /opt/xone
            
            # 2. Đồng bộ code mới nhất từ GitHub
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. Build và khởi động lại các Container trực tiếp trên VPS
            docker compose up -d --build --remove-orphans
            
            # 4. Dọn dẹp Docker images cũ để tránh đầy ổ cứng
            docker image prune -f
            echo "DEPLOY HOÀN TẤT THÀNH CÔNG!"
