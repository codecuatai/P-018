openapi: 3.0.3
info:
  title: X-One Gateway API
  version: 1.1.0
paths:
  /api/v1/healthcare-workflows/chat:
    post:
      summary: Process healthcare booking conversation and dispatch safe read/reversible tools
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthcareChatRequest'
      responses:
        '200':
          description: Agent response and validated Healthcare result
        '401':
          description: Missing or invalid user token
        '422':
          description: Invalid request
        '502':
          description: Internal service failure
  /api/v1/healthcare-workflows/payment:
    post:
      summary: Acknowledge the existing Healthcare payment mechanism for a held appointment
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HealthcarePaymentRequest'}
      responses:
        '200':
          description: Payment acknowledged and the authoritative appointment returned
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkflowEnvelope'}}
        '401': {description: Missing or invalid user token}
        '409': {description: Payment could not be acknowledged}
  /api/v1/healthcare-workflows/confirm:
    post:
      summary: Explicitly confirm a paid Healthcare appointment
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainConfirmationRequest'}
      responses:
        '200':
          description: Appointment confirmed by the Healthcare Service
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkflowEnvelope'}}
        '401': {description: Missing or invalid user token}
        '409': {description: Payment, confirmation, or idempotency precondition failed}
  /api/v1/restaurant-workflows/chat:
    post:
      summary: Process restaurant booking conversation and dispatch safe read tools
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantChatRequest'
      responses:
        '200':
          description: Agent response and validated Restaurant result
        '401':
          description: Missing or invalid user token
        '422':
          description: Invalid request
        '502':
          description: Internal service failure
  /api/v1/restaurant-workflows/confirm:
    post:
      summary: Explicitly confirm a held Restaurant reservation
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainConfirmationRequest'}
      responses:
        '200':
          description: Reservation created by the Restaurant Service
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkflowEnvelope'}}
        '401': {description: Missing or invalid user token}
        '409': {description: Confirmation or idempotency precondition failed}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    HealthcareChatRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
        workflow_id:
          type: string
        client_turn_id:
          type: string
        patient_id:
          type: integer
          minimum: 1
        symptoms:
          type: string
          maxLength: 2000
        context:
          type: object
          additionalProperties: true
    RestaurantChatRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
        workflow_id:
          type: string
        context:
          type: object
          additionalProperties: true
        client_turn_id:
          type: string
          minLength: 1
          maxLength: 100
    HealthcarePaymentRequest:
      type: object
      required: [appointment_id]
      additionalProperties: false
      properties:
        appointment_id: {type: integer, minimum: 1}
        workflow_id: {type: string, minLength: 1, maxLength: 100}
    DomainConfirmationRequest:
      type: object
      required: [confirmation_id]
      additionalProperties: false
      properties:
        confirmation_id: {type: string, minLength: 1, maxLength: 128}
        workflow_id: {type: string, minLength: 1, maxLength: 100}
    WorkflowEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, additionalProperties: true}
        meta: {type: object, additionalProperties: true}
