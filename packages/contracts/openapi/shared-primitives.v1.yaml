openapi: 3.1.0
info:
  title: X-One Shared Contract Primitives
  version: 1.0.0
  description: Versioned cross-boundary data and response primitives. Domain services remain authoritative for domain-specific schemas.
paths: {}
components:
  schemas:
    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: integer, minimum: 0}
        currency: {type: string, enum: [VND]}
    Address:
      type: object
      additionalProperties: false
      required: [id, label, address_text, latitude, longitude, city]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        label: {type: string, minLength: 1, maxLength: 80}
        address_text: {type: string, minLength: 1, maxLength: 500}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        ward: {type: string, maxLength: 120}
        district: {type: string, maxLength: 120}
        city: {type: string, minLength: 1, maxLength: 120}
    OpeningHours:
      type: object
      additionalProperties: false
      properties:
        monday: {$ref: '#/components/schemas/OpeningHoursEntry'}
        tuesday: {$ref: '#/components/schemas/OpeningHoursEntry'}
        wednesday: {$ref: '#/components/schemas/OpeningHoursEntry'}
        thursday: {$ref: '#/components/schemas/OpeningHoursEntry'}
        friday: {$ref: '#/components/schemas/OpeningHoursEntry'}
        saturday: {$ref: '#/components/schemas/OpeningHoursEntry'}
        sunday: {$ref: '#/components/schemas/OpeningHoursEntry'}
    OpeningHoursEntry:
      type: object
      additionalProperties: false
      required: [is_closed]
      properties:
        is_closed: {type: boolean}
        opens_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        closes_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    Rating:
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value: {type: number, minimum: 0, maximum: 5}
        count: {type: integer, minimum: 0}
    ImageRef:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        alt_text: {type: string, maxLength: 300}
    DatasetSource:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        uri: {type: string, format: uri, maxLength: 2048}
        license: {type: string, maxLength: 160}
        retrieved_at: {type: string, format: date-time}
    CurrentLocation:
      type: object
      additionalProperties: false
      required: [point, captured_at]
      properties:
        point: {$ref: '#/components/schemas/GeoPoint'}
        accuracy_meters: {type: number, minimum: 0}
        captured_at: {type: string, format: date-time}
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [cursor, has_more]
      properties:
        cursor: {type: [string, 'null'], maxLength: 512}
        has_more: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
    TimestampRange:
      type: object
      additionalProperties: false
      required: [start_at, end_at]
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
    ResponseMeta:
      type: object
      additionalProperties: true
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        pagination: {$ref: '#/components/schemas/PaginationMeta'}
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items: {type: array}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ErrorEnvelope:
      type: object
      additionalProperties: true
      required: [code, detail, retryable, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string, minLength: 1, maxLength: 100}
        detail: {type: string, minLength: 1, maxLength: 1000}
        retryable: {type: boolean}
        request_id: {type: string, minLength: 1, maxLength: 128}
