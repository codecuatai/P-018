openapi: 3.1.0
info:
  title: X-One Restaurant Service
  version: 1.3.0
paths:
  /v1/restaurants:
    get:
      summary: Discover active restaurants
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - {name: q, in: query, required: false, description: Case-insensitive substring match across restaurant name, location, or cuisine type. Queries with Vietnamese diacritics are accent-sensitive; queries without diacritics are accent-insensitive., schema: {type: string}}
        - {name: location, in: query, required: false, schema: {type: string}}
        - {name: cuisine_type, in: query, required: false, schema: {type: string}}
        - {name: budget_range, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Restaurant list envelope
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '401': {description: Internal authentication or actor context is missing}
  /v1/restaurants/{restaurant_id}:
    get:
      summary: Read one active restaurant
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - name: restaurant_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Restaurant envelope
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '401': {description: Internal authentication or actor context is missing}
        '404': {description: Restaurant not found}
  /v1/restaurants/{restaurant_id}/availability:
    post:
      summary: Check table availability
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - name: restaurant_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityRequest'}}}
      responses:
        '200':
          description: Availability envelope
          content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityEnvelope'}}}
        '404': {description: Restaurant not found}
  /v1/reservation-holds:
    post:
      summary: Create an idempotent reservation hold
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HoldRequest'}}}
      responses:
        '201': {description: Hold created or replayed}
        '409': {description: Conflict}
  /v1/reservations:
    get:
      summary: List reservations owned by the asserted actor
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
      responses:
        '200': {description: Actor-owned reservations}
    post:
    post:
      summary: Consume a validated hold into a reservation
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReservationRequest'}}}
      responses:
        '201': {description: Reservation created or replayed}
        '409': {description: Conflict}
  /v1/reservations/{reservation_id}:
    get:
      summary: Read an actor-owned reservation
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - name: reservation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Reservation envelope
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '404': {description: Reservation not found}
    patch:
      summary: Update an actor-owned reservation
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: reservation_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReservationUpdateRequest'}}}
      responses:
        '200':
          description: Updated reservation envelope
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '404': {description: Reservation not found}
        '409': {description: Conflict}
  /v1/reservations/{reservation_id}/cancel:
    post:
      summary: Cancel an actor-owned reservation
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: reservation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Cancelled reservation envelope
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '404': {description: Reservation not found}
        '409': {description: Conflict}
  /v1/internal/ops/summary:
    get:
      summary: Read Restaurant operational counts
      parameters: [{$ref: '#/components/parameters/InternalToken'}]
      responses: {'200': {description: Operational summary}, '401': {description: Internal authentication is missing}}
  /v1/internal/ops/dataset-status:
    get:
      summary: Read Restaurant dataset status
      parameters: [{$ref: '#/components/parameters/InternalToken'}]
      responses: {'200': {description: Dataset status}, '401': {description: Internal authentication is missing}}
  /v1/internal/ops/transactions:
    get:
      summary: Read paged Restaurant reservations
      parameters:
        - {$ref: '#/components/parameters/InternalToken'}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses: {'200': {description: Paged reservations}, '401': {description: Internal authentication is missing}}
components:
  parameters:
    InternalToken:
      name: X-Internal-Service-Token
      in: header
      required: true
      schema: {type: string}
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  schemas:
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, additionalProperties: true}
        meta: {type: object, additionalProperties: true}
    Restaurant:
      type: object
      additionalProperties: false
      required: [id, name, location, cuisine_type, budget_range, rating, timezone]
      properties:
        id: {type: string}
        name: {type: string}
        location: {type: string}
        cuisine_type: {type: string}
        cuisine_tags: {type: array, items: {type: string}}
        budget_range: {type: string}
        price_level: {type: [string, 'null']}
        rating: {type: number, minimum: 0, maximum: 5}
        review_count: {type: [integer, 'null'], minimum: 0}
        timezone: {type: string}
        image_url: {type: [string, 'null'], format: uri}
        description: {type: [string, 'null']}
        address: {type: [string, 'null']}
        ward: {type: [string, 'null']}
        district: {type: [string, 'null']}
        city: {type: [string, 'null']}
        latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
        longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
        coordinate_status: {type: [string, 'null'], enum: [validated, missing, suspicious_default, null]}
        phone: {type: [string, 'null']}
        website: {type: [string, 'null'], format: uri}
        opening_hours: {type: [string, 'null']}
    AvailabilityRequest:
      type: object
      required: [party_size, start_at]
      additionalProperties: false
      properties:
        party_size: {type: integer, minimum: 1}
        start_at: {type: string, format: date-time}
        duration_minutes: {type: integer, minimum: 30, maximum: 360, default: 120}
        seating_type: {type: [string, 'null']}
    AvailabilitySnapshot:
      type: object
      additionalProperties: false
      required: [restaurant_id, start_at, end_at, party_size, available, table_code, snapshot_id, resource_version, observed_at, expires_at]
      properties:
        restaurant_id: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        party_size: {type: integer, minimum: 1}
        available: {type: boolean}
        table_code: {type: [string, 'null']}
        snapshot_id: {type: string, minLength: 1, maxLength: 200}
        resource_version: {type: string, minLength: 1, maxLength: 80}
        observed_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    AvailabilityEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/AvailabilitySnapshot'}
        meta: {type: object, additionalProperties: true}
    HoldRequest:
      type: object
      required: [restaurant_id, party_size, start_at]
      additionalProperties: false
      properties:
        restaurant_id: {type: string}
        party_size: {type: integer, minimum: 1}
        start_at: {type: string, format: date-time}
        duration_minutes: {type: integer, minimum: 30, maximum: 360, default: 120}
    ReservationRequest:
      type: object
      required: [restaurant_id, party_size, start_at]
      additionalProperties: false
      properties:
        restaurant_id: {type: string}
        party_size: {type: integer, minimum: 1}
        start_at: {type: string, format: date-time}
        duration_minutes: {type: integer, minimum: 30, maximum: 360, default: 120}
        special_requests: {type: [string, 'null']}
        hold_id: {type: [string, 'null']}
    ReservationUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        party_size: {type: [integer, 'null'], minimum: 1}
        start_at: {type: [string, 'null'], format: date-time}
        special_requests: {type: [string, 'null']}
